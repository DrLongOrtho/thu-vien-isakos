let navMode = store.get("mode", "cd");
const values = m => m === "cd" ? CAT.tracks : m === "hn" ? CAT.courses : CAT.formats;
function inGroup(m, v){                      // → [[phiên, [số thứ tự bài thuộc nhóm]], …]
  return CAT.sessions.map(s => {
    if (m === "cd" && !s.tr.includes(v)) return null;
    if (m === "hn" && s.c !== v) return null;
    let idx = s.items.map((_, i) => i);
    if (m === "ht") { idx = idx.filter(i => s.items[i].f === v); if (!idx.length) return null; }
    return [s, idx]; }).filter(Boolean);
}
const ikey = it => it.v + "@" + it.s;            // 1 bài có thể nằm ở nhiều nhóm → đếm 1 lần
const uniq = L => { const m = new Map(); L.forEach(([s, idx]) => idx.forEach(i => m.set(ikey(s.items[i]), s.items[i]))); return [...m.values()]; };
const countL = L => uniq(L).length;
const durL = L => uniq(L).reduce((a, it) => a + it.d, 0);
const link = (m, v, s, i) => `#/${m}/${enc(v)}/${s.k}` + (i == null ? "" : `/${i}`);
const COUNT = {};

function navBar(m, cur){
  navMode = m || navMode;
  $("#tracks").innerHTML = `<span class="modes" role="tablist" aria-label="Cách xem">${Object.entries(MODES).map(([k, lab]) =>
      `<button class="md" type="button" role="tab" data-m="${k}" aria-selected="${k === navMode}">${lab}</button>`).join("")}</span>` +
    `<div class="rail-box"><div class="rail">${values(navMode).map(v => `<a class="tk" href="#/${navMode}/${enc(v)}" ${v === cur ? 'aria-current="page"' : ""}>${esc(v)}<small>${nf(COUNT[navMode][v])}</small></a>`).join("")}</div>
    <button class="rail-btn l" type="button" aria-label="Xem các mục phía trước" tabindex="-1">${IC.prev}</button><button class="rail-btn r" type="button" aria-label="Xem thêm các mục" tabindex="-1">${IC.next}</button></div>`;
  document.querySelectorAll(".md").forEach(b => b.onclick = () => { navMode = b.dataset.m; store.set("mode", navMode); navBar(navMode, ""); });
  const box = $(".rail-box"), rail = $(".rail"), a = rail.querySelector("[aria-current]");
  const edge = () => { const max = rail.scrollWidth - rail.clientWidth; box.classList.toggle("more-l", rail.scrollLeft > 4); box.classList.toggle("more-r", rail.scrollLeft < max - 4); };
  rail.addEventListener("scroll", edge, {passive: true});
  box.querySelectorAll(".rail-btn").forEach(b => b.onclick = () => rail.scrollBy({left: (b.classList.contains("l") ? -0.7 : 0.7) * rail.clientWidth, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}));
  if (a) rail.scrollLeft = a.offsetLeft - (rail.clientWidth - a.offsetWidth) / 2;
  edge();
}
addEventListener("resize", () => { const r = $(".rail"); if (r) r.dispatchEvent(new Event("scroll")); }, {passive: true});

function talkRow(m, v, s, i, n){
  const it = s.items[i];
  return `<a class="talk" href="${link(m, v, s, i)}"><span class="n">${n+1}</span>${thumb(it.th)}
    <span><b>${it.w ? '<span class="wtag">Cả phiên</span>' : ""}${esc(it.t)}</b><span class="en">${esc(it.e)}</span>${it.p.length ? `<span class="who">${esc(it.p.join(", "))}</span>` : ""}</span>
    <span class="d">${clock(it.d)}</span></a>`;
}
function sessionCard(m, v, s, idx){
  const d = idx.reduce((a, i) => a + s.items[i].d, 0), many = idx.length > 12 && !openS.has(s.k);
  const tags = [m !== "ht" && s.f && s.f !== s.e && s.f !== s.t ? s.f : ""].filter(Boolean);
  return `<section class="session" id="${s.k}"><div class="sh"><h3>${esc(s.t)}</h3>${s.e !== s.t ? `<div class="en">${esc(s.e)}</div>` : ""}
    <div class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}<span class="tag num">${idx.length} bài</span><span class="tag num">${clock(d)}</span></div></div>
    ${idx.slice(0, many ? 10 : 1e9).map((i, n) => talkRow(m, v, s, i, n)).join("")}
    ${many ? `<button class="more" type="button" data-open="${s.k}">Xem tất cả ${idx.length} bài ${IC.down}</button>` : ""}</section>`;
}
const fig = (n, lab) => `<span><b>${n}</b>${lab}</span>`;

function home(){
  navBar(navMode, "");
  const all = CAT.sessions.map(s => [s, s.items.map((_, i) => i)]);
  const stat = m => values(m).map(v => { const L = inGroup(m, v); return [v, countL(L), durL(L)]; });
  const T = stat("cd"), C = stat("hn"), F = stat("ht"), top = Math.max(...T.map(x => x[2]), 1);
  const rows = (m, list, bars, cols) => `<ol class="rows" style="--cols:${cols};--rows:${Math.ceil(list.length / cols)}">${list.map(([v, n, d]) =>
      `<li><a class="row${bars ? "" : " s"}" href="#/${m}/${enc(v)}"><span class="nm">${esc(v)}</span><span class="num">${nf(n)}<small>bài</small></span><span class="num">${hrs(d)}<small>giờ</small></span>${bars ? `<span class="bar" aria-hidden="true"><i style="--w:${(d / top * 100).toFixed(1)}%"></i></span>` : ""}</a></li>`).join("")}</ol>`;
  $("#app").innerHTML = `<section class="band mast"><div class="wrap mast-in"><div class="mast-text">
      <h1>Thư viện bài giảng<br>ISAKOS</h1>
      <p class="lead">Dịch và biên soạn bởi Bs. Hoàng Trọng Bảo Long</p>
      <p class="figs">${fig(nf(countL(all)), "bài giảng")}${fig(hrs(durL(all)), "giờ video")}</p></div></div>
      ${facets(MAST)}</section>
    <div class="wrap idx">
      <section><h2>Theo chuyên đề</h2>${rows("cd", T, true, 2)}</section>
      <section><h2>Theo hội nghị / khóa học</h2><ul class="cards">${C.map(([v, n, d], k) =>
        `<li><a class="crs" href="#/hn/${enc(v)}">${k === 0 ? facets(CARD) : ""}<b>${esc(v)}</b><span class="meta"><span><strong>${nf(n)}</strong>bài giảng</span><span><strong>${hrs(d)}</strong>giờ video</span></span></a></li>`).join("")}</ul></section>
      <section><h2>Theo hình thức</h2>${rows("ht", F, false, 3)}</section>
    </div>`;
}

function listView(m, v, focus){
  navBar(m, v);
  const L = inGroup(m, v), key = "loc." + m + "." + v;
  let f = {}; try { f = JSON.parse(store.get(key, "{}")); } catch(e) {}
  // bộ lọc phụ: chủ đề con (chuyên đề), hội nghị (chuyên đề / hình thức), chuyên đề (hội nghị)
  const topics = m === "cd" ? (CAT.topics[v] || []) : [];
  const courses = m !== "hn" ? CAT.courses.filter(c => L.some(([s]) => s.c === c)) : [];
  const tracks = m === "hn" ? CAT.tracks.filter(t => L.some(([s]) => s.tr[0] === t)) : [];
  if (f.tp && !topics.includes(f.tp)) f.tp = ""; if (f.c && !courses.includes(f.c)) f.c = ""; if (f.t && !tracks.includes(f.t)) f.t = "";
  const shown = L.filter(([s]) => (!f.tp || s.tp.some(([t, tp]) => t === v && tp === f.tp)) && (!f.c || s.c === f.c) && (!f.t || s.tr[0] === f.t));
  const chips = (name, list, all) => list.length > 1 ? `<div class="courses">${[["", all], ...list.map(x => [x, x])].map(([x, lab]) =>
      `<button class="cs" type="button" data-k="${name}" data-v="${esc(x)}" aria-pressed="${(f[name] || "") === x}">${esc(lab)}</button>`).join("")}</div>` : "";
  const groups = m === "hn" ? (tracks.length ? tracks : ["Khác"]) : courses;
  const gOf = s => m === "hn" ? s.tr[0] : s.c;
  let nSes = 0;
  const body = groups.map(g => { const seen = new Set();
        const G = shown.filter(([s]) => gOf(s) === g).map(([s, idx]) => [s, idx.filter(i => !seen.has(ikey(s.items[i])) && seen.add(ikey(s.items[i])))])
                       .filter(([s, idx]) => idx.length);
        nSes += G.length;
        return G.length ? `<h2 class="course">${esc(g)}</h2>` + G.map(([s, idx]) => sessionCard(m, v, s, idx)).join("") : ""; }).join("");
  const filters = chips("tp", topics, "Mọi chủ đề") + chips("c", courses, "Mọi hội nghị") + chips("t", tracks, "Mọi chuyên đề");
  $("#app").innerHTML = `<section class="band"><div class="wrap band-in">
      <nav class="crumb" aria-label="Vị trí"><a href="#/">Thư viện</a><span class="sep" aria-hidden="true">›</span><span>${MODES[m]}</span></nav>
      <h1>${esc(v)}</h1>
      <p class="figs">${fig(nf(countL(shown)), "bài giảng")}${fig(nf(nSes), "phiên")}${fig(hrs(durL(shown)), "giờ video")}</p></div>
      ${facets(BAND)}</section>
    <div class="wrap list">${filters ? `<div class="filters">${filters}</div>` : ""}
      ${body || `<div class="empty">Chưa có bài giảng trong mục này. <a href="#/">Về thư viện</a></div>`}</div>`;
  document.querySelectorAll(".cs").forEach(b => b.onclick = () => { f[b.dataset.k] = b.dataset.v; store.set(key, JSON.stringify(f)); const y = scrollY; listView(m, v); scrollTo(0, y); });
  document.querySelectorAll(".more").forEach(b => b.onclick = () => { openS.add(b.dataset.open); const y = scrollY; listView(m, v); scrollTo(0, y); });
  if (focus) { const el = document.getElementById(focus); if (el) { el.scrollIntoView({block:"start"}); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600); } }
}

async function talkView(m, v, k, i){
  const s = SES[k]; i = +i;
  if (!s || !s.items[i]) { $("#app").innerHTML = `<div class="wrap"><div class="empty">Không tìm thấy bài giảng này. <a href="#/">Về thư viện</a></div></div>`; return; }
  navBar(m, v);
  const it = s.items[i], start = it.s > 0 ? `?t=${Math.floor(it.s)}` : "";
  const idx = m === "ht" ? s.items.map((_, j) => j).filter(j => s.items[j].f === v) : s.items.map((_, j) => j);
  const pos = idx.indexOf(i);
  document.title = it.t + " · ISAKOS 2025";
  const prev = pos > 0 ? link(m, v, s, idx[pos-1]) : "", next = pos >= 0 && pos < idx.length - 1 ? link(m, v, s, idx[pos+1]) : "";
  const sep = `<span class="sep" aria-hidden="true">›</span>`;
  $("#app").innerHTML = `<div class="wrap watch"><div class="main">
      <nav class="crumb" aria-label="Vị trí"><a href="#/">Thư viện</a>${sep}<span>${MODES[m]}</span>${sep}<a href="#/${m}/${enc(v)}">${esc(v)}</a>${m !== "hn" ? `${sep}<span>${esc(s.c)}</span>` : ""}${sep}<a href="${link(m, v, s)}">${esc(s.t)}</a></nav>
      <div class="player"><iframe src="https://drive.google.com/file/d/${it.g}/preview${start}" allow="autoplay; fullscreen" allowfullscreen title="${esc(it.t)}"></iframe></div>
      ${it.s > 0 ? `<p class="note">Bài này bắt đầu ở phút ${clock(it.s)} của video ghi cả phiên. Nếu video không tự nhảy tới, hãy kéo thanh thời gian tới ${clock(it.s)} hoặc mở trên Drive.</p>` : ""}
      <div class="vh"><h1>${it.w ? '<span class="wtag">Cả phiên</span>' : ""}${esc(it.t)}</h1><p class="en">${esc(it.e)}</p>
        <div class="tags">${[m !== "ht" && it.f !== s.t ? it.f : "", ...s.tr.filter(t => t !== "Khác" && t !== v)].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
          <span class="tag num">Bài ${pos+1}/${idx.length} của phiên</span><span class="tag num">${clock(it.d)}</span></div>
        <div class="actions"><a class="btn" href="${prev || "#"}" aria-disabled="${!prev}">${IC.prev}Bài trước</a><a class="btn" href="${next || "#"}" aria-disabled="${!next}">Bài tiếp theo${IC.next}</a>
          <a class="btn p" href="https://drive.google.com/file/d/${it.g}/view${start}" target="_blank" rel="noopener">Mở trên Google Drive${IC.out}</a>
          <button class="btn" id="share" type="button">${IC.link}Sao chép link</button></div></div>
      <div id="main"></div></div>
    <aside class="side">
      <div class="card"><h2>Các bài trong phiên (${idx.length})</h2><div class="plist">${idx.map((j, n) => { const x = s.items[j];
        return `<a href="${link(m, v, s, j)}" aria-current="${j===i}"><span class="n">${n+1}</span><span>${x.w ? '<span class="wtag">Cả phiên</span>' : ""}${esc(x.t)}<small>${x.p.length ? `<span>${esc(x.p.join(", "))}</span>` : ""}<span class="num">${clock(x.d)}</span></small></span></a>`; }).join("")}</div></div>
      <div id="spk"></div></aside></div>`;
  const pl = $(".plist"), cur = pl && pl.querySelector('[aria-current="true"]');
  if (cur && cur.offsetTop > pl.clientHeight / 2) pl.scrollTop = cur.offsetTop - pl.clientHeight / 3;
  $("#share").onclick = async () => { try { await navigator.clipboard.writeText(location.href); toast("Đã sao chép link bài này"); } catch(e) { prompt("Link:", location.href); } };
  let d = { sum: [], spk: [] };
  try { d = await (await fetch(`data/v/${it.v}.json`)).json(); } catch(e) {}
  if (route().parts.slice(-2).join("/") !== [k, String(i)].join("/")) return;
  const whole = s.items.filter(x => x.v === it.v).length > 1 || it.ch;
  $("#main").innerHTML = d.sum.length ? `<section class="sum"><h2>${whole ? "Nội dung chính của cả phiên" : "Nội dung chính"}</h2><ul>${d.sum.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <p class="note">Tóm tắt do AI tạo từ lời giảng.</p></section>` : "";
  const ps = it.p.length ? d.spk.filter(p => it.p.includes(p.n)) : d.spk;
  $("#spk").innerHTML = ps.length ? `<div class="card"><h2>Diễn giả</h2><ul class="people">${ps.map(p => `<li>${esc(p.n)}<span>${esc(p.c)}</span></li>`).join("")}</ul></div>` : "";
}

function hl(text, words){ let out = esc(text); words.forEach(w => { if (w.length < 2) return;
  const f = fold(text), i = f.indexOf(w); if (i >= 0) out = esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + w.length)) + "</mark>" + esc(text.slice(i + w.length)); }); return out; }
function search(q){
  navBar(navMode, "");
  const ws = fold(q).trim().split(/\s+/).filter(Boolean), res = [];
  CAT.sessions.forEach(s => s.items.forEach((it, i) => { if (ws.every(w => it._f.includes(w) || s._f.includes(w))) res.push([s, it, i]); }));
  const sep = `<span class="sep" aria-hidden="true">›</span>`;
  $("#app").innerHTML = `<div class="wrap"><div class="head"><h1>Kết quả cho “${esc(q)}”</h1><p class="stats">${nf(res.length)} bài giảng${res.length > 200 ? ", hiện 200 bài đầu" : ""}</p></div><div class="results">` +
    (res.length ? res.slice(0, 200).map(([s, it, i]) => `<a class="res" href="${link("cd", s.tr[0], s, i)}">${thumb(it.th)}<span><span class="crumb"><span>${esc(s.tr[0])}</span>${sep}<span>${esc(s.c)}</span>${sep}<span>${esc(s.t)}</span></span>
      <b>${hl(it.t, ws)}</b><span class="en">${esc(it.e)}</span><span class="meta">${it.p.length ? `<span>${esc(it.p.join(", "))}</span>` : ""}<span class="num">${clock(it.d)}</span></span></span></a>`).join("") : `<div class="empty">Không tìm thấy bài giảng phù hợp. Thử từ khóa ngắn hơn, hoặc tên diễn giả.</div>`) + `</div></div>`;
}

let last = "";
function render(){
  let { parts, q } = route();
  if (parts.length && !MODES[parts[0]]) parts = ["cd", ...parts];          // link cũ dạng #/<chuyên đề>/…
  const key = parts.join("/");
  if (last && last.split("/").length === 2 && key !== last) listScroll[last] = scrollY;
  if (q) { search(q); }
  else if (!parts.length) { document.title = "ISAKOS 2025 · Lưu hành nội bộ CTCH BVQY 175"; home(); }
  else if (parts.length === 1) { navMode = parts[0]; home(); }
  else if (parts.length === 2) { document.title = parts[1] + " · ISAKOS 2025"; listView(parts[0], parts[1]); scrollTo(0, listScroll[key] || 0); }
  else if (parts.length === 3) { listView(parts[0], parts[1], parts[2]); }
  else { talkView(parts[0], parts[1], parts[2], parts[3]); scrollTo(0, 0); }
  last = key;
}
// chuyển trang mờ dần nhẹ (bỏ qua khi máy đặt giảm chuyển động)
const swap = fn => (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) ? document.startViewTransition(fn) : fn();
let qT;
$("#q").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => {
  const v = e.target.value.trim(); history.replaceState(null, "", v ? "#/?q=" + enc(v) : "#/"); render(); }, 200); });

fetch("data/catalog.json").then(r => r.json()).then(j => {
  CAT = j;
  CAT.sessions.forEach(s => { SES[s.k] = s; s._f = fold([s.t, s.e, s.c, s.tr.join(" "), s.f, s.tp.map(x => x[1]).join(" ")].join(" "));
    s.items.forEach(it => it._f = fold([it.t, it.e, it.p.join(" "), it.m, it.f].join(" "))); });
  for (const m of Object.keys(MODES)) { COUNT[m] = {}; values(m).forEach(v => COUNT[m][v] = countL(inGroup(m, v))); }
  const u = $("#upd"); u.textContent = j.updated; u.dateTime = String(j.updated).split("/").reverse().join("-"); $("#updrow").hidden = false;
  addEventListener("hashchange", () => swap(render)); render();
}).catch(() => { $("#app").innerHTML = `<div class="wrap"><div class="empty" role="alert">Thư viện đang được cập nhật, vui lòng quay lại sau.</div></div>`; });
</script>
</body>
</html>
