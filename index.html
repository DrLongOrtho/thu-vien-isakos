<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Thư viện bài giảng ISAKOS · Phụ đề tiếng Việt</title>
<meta name="description" content="Bài giảng y học thể thao – chỉnh hình có phụ đề tiếng Việt (bản không chính thức).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6e74'/%3E%3Cpath d='M10 11l6 10 6-10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --ink:#11151c; --muted:#5b6473; --faint:#8a93a1; --line:#e3e6eb; --chip:#eef1f4;
  --accent:#0b6e74; --accent-ink:#fff; --accent-soft:#e2f1f1; --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.06);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1115; --surface:#161a20; --ink:#e8ebef; --muted:#a0a8b4; --faint:#7c8592; --line:#262c35; --chip:#1e242c;
    --accent:#4fc3c7; --accent-ink:#06282a; --accent-soft:#12302f; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1115; --surface:#161a20; --ink:#e8ebef; --muted:#a0a8b4; --faint:#7c8592; --line:#262c35; --chip:#1e242c;
  --accent:#4fc3c7; --accent-ink:#06282a; --accent-soft:#12302f; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand b{display:block;font-size:15.5px;line-height:1.2;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.search{flex:1;max-width:520px;margin-left:auto;position:relative}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px 0 40px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:13px;top:12px;color:var(--faint)}
.theme{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--muted)}
@media (max-width:640px){ .brand small{display:none} .top-in{gap:10px} .brand b{font-size:14px} }
@media (max-width:420px){ .brand-t{display:none} }

/* home */
.hero{padding:26px 0 8px}
.hero h1{font-size:clamp(21px,3vw,28px);margin:0 0 4px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 6px}
.select{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;max-width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.chip small{color:var(--faint);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.count{color:var(--muted);font-size:13.5px;margin:2px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(16,24,40,.12)}
.thumb{position:relative;aspect-ratio:16/9;background:var(--chip);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.badge.l{left:8px;right:auto;background:var(--accent);color:var(--accent-ink)}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.kicker{font-size:12px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.card h3{margin:0;font-size:15.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.en{color:var(--faint);font-size:13px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.spk{color:var(--muted);font-size:13px;margin-top:auto;padding-top:6px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.more{display:block;margin:26px auto 10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 22px;cursor:pointer;font-weight:600}
.empty{padding:60px 0;text-align:center;color:var(--muted)}

/* video */
.back{display:inline-flex;align-items:center;gap:6px;margin:18px 0 12px;color:var(--muted);text-decoration:none;font-size:14px}
.back:hover{color:var(--ink)}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vhead h1{font-size:clamp(20px,2.6vw,27px);line-height:1.3;margin:18px 0 4px;letter-spacing:-.015em}
.vhead .en{font-size:14.5px;-webkit-line-clamp:3}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tag{background:var(--chip);border-radius:8px;padding:3px 10px;font-size:13px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;text-decoration:none;font-size:14px;font-weight:500}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;margin:18px 0 40px}
@media (max-width:900px){ .cols{grid-template-columns:1fr} }
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.panel ul{margin:0;padding-left:18px}
.panel li{margin:5px 0}
.talk{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.talk:first-of-type{border-top:0}
.talk time{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;font-size:13.5px;padding-top:1px}
.talk b{font-weight:600;display:block}
.talk small{color:var(--faint);display:block}
.people{list-style:none;padding:0!important}
.people li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:7px 0;margin:0}
.people li:first-child{border-top:0}
.people span{color:var(--faint);font-size:13px;text-align:right}
.rel{display:grid;grid-template-columns:110px 1fr;gap:10px;text-decoration:none;padding:8px 0;border-top:1px solid var(--line)}
.rel:first-of-type{border-top:0}
.rel img{width:110px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--chip)}
.rel b{font-size:13.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note{color:var(--faint);font-size:12.5px}
footer{border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;padding:22px 0 40px;margin-top:30px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
  <a class="brand" href="#/">
    <span class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 6l7 12 7-12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="brand-t"><b>Thư viện bài giảng ISAKOS</b><small>Phụ đề tiếng Việt · bản không chính thức</small></span>
  </a>
  <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Tìm bài giảng, diễn giả, nội dung…" autocomplete="off" aria-label="Tìm kiếm"></label>
  <button class="theme" id="theme" type="button" aria-label="Đổi giao diện sáng/tối"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
</div></header>
<main class="wrap" id="app"><div class="empty">Đang tải thư viện…</div></main>
<footer><div class="wrap">Phụ đề tiếng Việt được dịch tự động bằng AI (Gemini) từ bài giảng của ISAKOS, dùng cho mục đích học tập. Trang này <b>không chính thức</b> và không thuộc ISAKOS; bản quyền nội dung thuộc ISAKOS và các diễn giả. <span id="upd"></span></div></footer>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fold = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
const dur = s => { s = Math.round(s||0); const h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return h ? `${h} giờ ${String(m).padStart(2,"0")}` : `${m} phút`; };
const clock = s => { s = Math.floor(s||0); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };
const store = { get(k, d){ try { const v = localStorage.getItem("tv." + k); return v == null ? d : v; } catch(e) { return d; } },
                set(k, v){ try { localStorage.setItem("tv." + k, v); } catch(e) {} } };
const toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 1800); };

let DB = [], BYID = {}, listScroll = 0, shown = 48;
const theme = store.get("theme", "");
if (theme) document.documentElement.dataset.theme = theme;
$("#theme").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark"; store.set("theme", document.documentElement.dataset.theme);
};

function params(){ const h = location.hash.replace(/^#/, ""); const [path, qs] = h.split("?"); return { path: path || "/", p: new URLSearchParams(qs || "") }; }
function go(p){ const s = p.toString(); location.hash = "#/" + (s ? "?" + s : ""); }

function card(v){
  const kick = [v.c, v.k[0]].filter(Boolean).join(" · ");
  return `<a class="card" href="#/v/${v.id}">
    <div class="thumb">${v.th ? `<img loading="lazy" src="${esc(v.th)}" alt="">` : ""}<span class="badge">${clock(v.d)}</span>${v.n > 1 ? `<span class="badge l">${v.n} bài</span>` : ""}</div>
    <div class="cbody"><div class="kicker">${esc(kick)}</div><h3>${esc(v.t)}</h3><div class="en">${esc(v.e)}</div>
    <div class="spk">${esc(v.s.slice(0,3).join(", "))}${v.s.length > 3 ? ` và ${v.s.length-3} người khác` : ""}</div></div></a>`;
}

function home(){
  const { p } = params();
  const q = p.get("q") || "", c = p.get("c") || "", k = p.get("k") || "", sort = p.get("s") || "";
  if ($("#q").value !== q && document.activeElement !== $("#q")) $("#q").value = q;
  const fq = fold(q).trim().split(/\s+/).filter(Boolean);
  let list = DB.filter(v => (!c || v.c === c) && (!fq.length || fq.every(w => v._f.includes(w))));
  const byTrack = {}; list.forEach(v => v.k.forEach(t => byTrack[t] = (byTrack[t]||0) + 1));
  if (k) list = list.filter(v => v.k.includes(k));
  if (sort === "new") list = [...list].sort((a,b) => b.a - a.a);
  else if (sort === "long") list = [...list].sort((a,b) => b.d - a.d);
  else if (sort === "short") list = [...list].sort((a,b) => a.d - b.d);
  const courses = {}; DB.forEach(v => courses[v.c] = (courses[v.c]||0) + 1);
  const hours = DB.reduce((a,v) => a + v.d, 0) / 3600;
  const set = (key, val) => { const n = new URLSearchParams(p); val ? n.set(key, val) : n.delete(key); shown = 48; go(n); };
  $("#app").innerHTML = `
    <section class="hero"><h1>Bài giảng y học thể thao – chỉnh hình, phụ đề tiếng Việt</h1>
      <p>${DB.length.toLocaleString("vi-VN")} bài giảng · ${hours.toLocaleString("vi-VN",{maximumFractionDigits: hours < 10 ? 1 : 0})} giờ video từ các hội nghị, webinar và trình diễn phẫu thuật ISAKOS.</p></section>
    <div class="filters">
      <select class="select" id="fc" aria-label="Hội nghị / khóa học"><option value="">Mọi hội nghị / khóa học</option>
        ${Object.keys(courses).map(x => `<option value="${esc(x)}" ${x===c?"selected":""}>${esc(x)} (${courses[x]})</option>`).join("")}</select>
      <select class="select" id="fs" aria-label="Sắp xếp">
        <option value="">Sắp xếp: theo hội nghị</option><option value="new" ${sort==="new"?"selected":""}>Mới thêm</option>
        <option value="long" ${sort==="long"?"selected":""}>Dài nhất</option><option value="short" ${sort==="short"?"selected":""}>Ngắn nhất</option></select>
    </div>
    <div class="chips" role="group" aria-label="Chuyên đề">
      <button class="chip" data-k="" aria-pressed="${!k}">Tất cả chuyên đề</button>
      ${Object.entries(byTrack).sort((a,b)=>b[1]-a[1]).map(([t,n]) => `<button class="chip" data-k="${esc(t)}" aria-pressed="${t===k}">${esc(t)}<small>${n}</small></button>`).join("")}
    </div>
    <div class="count">${list.length.toLocaleString("vi-VN")} bài giảng${q ? ` cho “${esc(q)}”` : ""}</div>
    ${list.length ? `<div class="grid">${list.slice(0, shown).map(card).join("")}</div>` : `<div class="empty">Không tìm thấy bài giảng phù hợp.</div>`}
    ${list.length > shown ? `<button class="more" id="more">Xem thêm (${(list.length - shown).toLocaleString("vi-VN")})</button>` : ""}`;
  $("#fc").onchange = e => set("c", e.target.value);
  $("#fs").onchange = e => set("s", e.target.value);
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => set("k", b.dataset.k));
  if ($("#more")) $("#more").onclick = () => { shown += 48; const y = scrollY; home(); scrollTo(0, y); };
}

async function video(id){
  const v = BYID[id];
  if (!v) { $("#app").innerHTML = `<div class="empty">Không tìm thấy bài giảng này. <a href="#/">Về thư viện</a></div>`; return; }
  document.title = v.t + " · Thư viện ISAKOS";
  const drive = `https://drive.google.com/file/d/${v.g}/view`;
  $("#app").innerHTML = `
    <a class="back" href="javascript:history.length>1?history.back():location.hash='#/'">← Thư viện</a>
    <div class="player"><iframe src="https://drive.google.com/file/d/${v.g}/preview" allow="autoplay; fullscreen" allowfullscreen title="${esc(v.t)}"></iframe></div>
    <div class="vhead"><h1>${esc(v.t)}</h1><div class="en">${esc(v.e)}</div>
      <div class="tags"><span class="tag">${esc(v.c)}</span>${v.k.map(t => `<span class="tag">${esc(t)}</span>`).join("")}${v.f.map(f => `<span class="tag">${esc(f)}</span>`).join("")}<span class="tag">${dur(v.d)}</span></div>
      <div class="actions"><a class="btn p" href="${drive}" target="_blank" rel="noopener">Mở trong Google Drive ↗</a>
        <button class="btn" id="share" type="button">Sao chép link bài này</button></div>
      <p class="note">Phụ đề tiếng Việt đã in sẵn trong video. Nếu video chưa phát, bấm “Mở trong Google Drive”.</p></div>
    <div class="cols"><div id="main"><div class="panel"><div class="note">Đang tải…</div></div></div><aside id="side"></aside></div>`;
  $("#share").onclick = async () => { try { await navigator.clipboard.writeText(location.href); toast("Đã sao chép link"); } catch(e) { prompt("Link bài giảng:", location.href); } };
  let d = { sum: [], talks: [], spk: [] };
  try { d = await (await fetch(`data/v/${id}.json`)).json(); } catch(e) {}
  if (params().path !== "/v/" + id) return;
  $("#main").innerHTML = `
    ${d.sum.length ? `<div class="panel"><h2>Nội dung chính</h2><ul>${d.sum.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      <p class="note">Tóm tắt do AI tạo từ lời giảng.</p></div>` : ""}
    ${d.talks.length > 1 ? `<div class="panel"><h2>Các bài trong phiên (${d.talks.length})</h2>
      ${d.talks.map(t => `<div class="talk"><time>${clock(t.s)}</time><div><b>${esc(t.t)}</b><small>${esc(t.e)}</small>
        ${t.p.length ? `<small>${esc(t.p.join(", "))}</small>` : ""}</div></div>`).join("")}
      <p class="note">Mốc thời gian là thời điểm bắt đầu mỗi bài trong video.</p></div>` : ""}`;
  const rel = DB.filter(x => x.id !== id && x.c === v.c && x.k.some(t => v.k.includes(t))).slice(0, 6);
  $("#side").innerHTML = `
    ${d.spk.length ? `<div class="panel"><h2>Diễn giả</h2><ul class="people">${d.spk.map(s => `<li>${esc(s.n)}<span>${esc(s.c)}</span></li>`).join("")}</ul></div>` : ""}
    ${rel.length ? `<div class="panel"><h2>Cùng chuyên đề</h2>${rel.map(r => `<a class="rel" href="#/v/${r.id}">${r.th ? `<img loading="lazy" src="${esc(r.th)}" alt="">` : "<span></span>"}<div><b>${esc(r.t)}</b><span class="note">${clock(r.d)}</span></div></a>`).join("")}</div>` : ""}`;
}

let lastPath = "";
function route(){
  const { path } = params();
  if (lastPath === "/" && path !== "/") listScroll = scrollY;
  if (path.startsWith("/v/")) { video(path.slice(3)); scrollTo(0, 0); }
  else { document.title = "Thư viện bài giảng ISAKOS · Phụ đề tiếng Việt"; home(); if (lastPath.startsWith("/v/")) requestAnimationFrame(() => scrollTo(0, listScroll)); }
  lastPath = path;
}

let qTimer;
$("#q").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => {
  const { path, p } = params(); const n = path === "/" ? new URLSearchParams(p) : new URLSearchParams();
  e.target.value ? n.set("q", e.target.value) : n.delete("q"); shown = 48;
  history.replaceState(null, "", "#/" + (n.toString() ? "?" + n : "")); route(); }, 180); });

fetch("data/catalog.json").then(r => r.json()).then(j => {
  DB = j.videos; DB.forEach(v => { BYID[v.id] = v; v._f = fold([v.t, v.e, v.c, v.k.join(" "), v.s.join(" "), v.f.join(" "), v.m].join(" ")); });
  $("#upd").textContent = "Cập nhật " + j.updated + ".";
  addEventListener("hashchange", route); route();
}).catch(() => { $("#app").innerHTML = `<div class="empty">Thư viện đang được cập nhật, vui lòng quay lại sau.</div>`; });
